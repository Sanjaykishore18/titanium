version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: titanium-redis
    ports:
      - "6379:6379"
    networks:
      - titanium-net
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: titanium-backend
    volumes:
      - ./backend:/app
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - titanium-net
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: titanium-frontend
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - titanium-net
    restart: unless-stopped

networks:
  titanium-net:
    driver: bridge