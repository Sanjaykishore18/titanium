# ============================================================================
# PERFECT NGINX CONFIGURATION - Combines your setup with URL fix
# Save as: frontend/nginx.conf
# ============================================================================

events {
    worker_connections 1024;
}

http {
    # ✅ IMPORTANT: Include MIME types for CSS, JS, HTML
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Backend upstream
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # ============================================
        # FRONTEND STATIC FILES
        # ============================================
        
        # Round 1 game pages
        location /round1/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        # Round 2 game pages
        location /round2/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        # Round 3 game pages
        location /round3/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        # Assets (CSS, JS, images)
        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        # ============================================
        # BACKEND PROXYING
        # ============================================

        # Backend API endpoints
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket connections
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============================================
        # DJANGO BACKEND (Dashboard, Admin, etc.)
        # ============================================
        
        # Everything else goes to Django backend
        # This includes:
        # - / (login/dashboard)
        # - /dashboard/
        # - /admin-panel/
        # - /logout/
        # - Django static files
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # ✅ Don't use try_files for backend proxying
            # Just pass everything to Django
        }
    }
}