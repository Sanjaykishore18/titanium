<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="0">
<title>Web Escape | Round 1 - Page 9 (Final Stage)</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Courier New', monospace;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES
   ============================================================================ */

/* BACKGROUND */
body {
  min-height: 100vh;
  background: url("./images/page10 bg.png") no-repeat center/cover;
  font-family: 'Courier New', monospace;
  color: #e50914;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 80px;
}

.container {
  text-align: center;
  background: rgba(0, 0, 0, 0.8);
  padding: 40px;
  border-radius: 10px;
  border: 2px solid #e50914;
}

h1 {
  font-size: 3rem;
  letter-spacing: 3px;
  text-shadow: 0 0 10px red;
  margin-bottom: 20px;
}

.container > p {
  font-size: 1.2rem;
  margin-bottom: 20px;
  color: #ccc;
}

.hint {
  font-size: 0.9rem;
  color: #ffd700;
  margin-bottom: 20px;
  font-style: italic;
}

input {
  padding: 12px;
  width: 280px;
  background: #000;
  border: 2px solid #e50914;
  color: #e50914;
  font-size: 1rem;
  text-align: center;
  font-family: 'Courier New', monospace;
}

input:focus {
  outline: none;
  border-color: #ff1a1a;
  box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
}

button {
  margin-top: 15px;
  padding: 10px 25px;
  background: #e50914;
  color: #000;
  border: none;
  cursor: pointer;
  font-weight: bold;
  font-size: 1rem;
  border-radius: 5px;
  transition: 0.3s;
}

button:hover {
  background: #ff1a1a;
  transform: scale(1.05);
}

.msg {
  margin-top: 15px;
  height: 20px;
  color: #ccc;
  font-size: 1rem;
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    h1 {
        font-size: 2rem;
    }
    
    input {
        width: 100%;
        max-width: 280px;
    }
    
    .container {
        padding: 30px 20px;
        margin: 0 20px;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🏁 FINAL STAGE
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- GAME CONTENT -->
<div class="container">
  <h1>THE FINAL GATE</h1>
  <p>The truth hides in plain sight.</p>
  <p class="hint">💡 Hint: Not everything is meant to be read normally.<br>Try looking at the console...</p>
  <input type="text" id="key" placeholder="Enter the final key" autocomplete="off">
  <br>
  <button onclick="verify()">UNLOCK</button>
  <div class="msg" id="msg"></div>
</div>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
console.log("🔍 Try looking at it upside down.");
// Visible but reversed
const hidden = "NWOD EDISPU";
console.log("🔑 Hidden key:", hidden);

function verify() {
  const userKey = document.getElementById("key").value
    .trim()
    .toUpperCase();
  
  const decoded = hidden
    .split("")
    .reverse()
    .join("")
    .replace(" ", "");
  
  console.log("Your answer:", userKey);
  console.log("Correct answer:", decoded);
  
  if (userKey === decoded) {
    completeRound();
  } else {
    document.getElementById("msg").innerText = "The gate remains sealed...";
  }
}

async function completeRound() {
  const msgDiv = document.getElementById("msg");
  msgDiv.style.color = "#0f0";
  msgDiv.innerText = "🎉 CORRECT! Completing round...";
  
  console.log("🎉 Round 1 completed!");
  
  // Wait for gameEngine
  let retries = 0;
  const maxRetries = 20;
  
  while (!window.gameEngine && retries < maxRetries) {
    await new Promise(resolve => setTimeout(resolve, 100));
    retries++;
  }
  
  if (window.gameEngine) {
    // Mark round as complete
    await gameEngine.completeRound();
  } else {
    console.error('Game engine not loaded!');
    // Fallback: Show success message
    document.body.innerHTML = `
      <div style="color:#0f0;text-align:center;padding-top:100px;">
        <h1 style="font-size:3rem;text-shadow:0 0 20px #0f0;">ROUND 1 COMPLETED</h1>
        <p style="font-size:1.5rem;margin-top:20px;">You escaped the Upside Down.</p>
        <p style="font-size:1rem;margin-top:40px;color:#ccc;">Refresh the page or return to lobby.</p>
      </div>
    `;
  }
}

// Allow Enter key to submit
document.getElementById("key").addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    verify();
  }
});
</script>

<!-- Not everything is meant to be read normally -->
</body>
</html>
