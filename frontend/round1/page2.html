<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="1">
<title>Web Escape | Round 1 - Page 2 (1 Bug)</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Courier New', monospace;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES
   ============================================================================ */

/* BACKGROUND */
body {
  min-height: 100vh;
  overflow: hidden;
  background: black;
  padding-top: 80px;
}

/* UPSIDE DOWN WORLD */
.world {
  width: 100%;
  height: calc(100vh - 80px);
  background: url("../assets/images/img 2.png") no-repeat center center/cover;
  position: relative;
  transform: rotate(180deg);  /* BUG 1: Should be removed to flip world right-side up */
}

/* Dark overlay (for vibe, NOT a bug) */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  pointer-events: none;
}

/* STORY BOX */
.story {
  position: absolute;
  top: 25%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ff4d4d;
  padding: 30px 35px;
  text-align: center;
  max-width: 520px;
  z-index: 2;
}

.story h2 {
  margin-bottom: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.story em {
  color: #ffd700;
}

.hint {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.8;
}

/* PORTAL */
.portal {
  position: absolute;
  bottom: 10%;
  right: 18%;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: radial-gradient(circle, #000 25%, #4b0082 55%, #8a2be2);
  box-shadow: 0 0 35px #8a2be2;
  z-index: 2;
}

/* ESCAPE BUTTON */
.escape-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 14px 32px;
  opacity: 0.2;
  background: #8a2be2;
  color: white;
  border: none;
  font-size: 17px;
  letter-spacing: 2px;
  cursor: not-allowed;
  pointer-events: none;
  z-index: 3;
  transition: 0.4s;
}

.escape-btn.active {
  opacity: 1;
  pointer-events: auto;
  cursor: pointer;
  background: #28a745;
  box-shadow: 0 0 20px rgba(40, 167, 69, 0.6);
}

.escape-btn.active:hover {
  background: #218838;
  transform: translate(-50%, -50%) scale(1.05);
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    .story {
        top: 60%;
        padding: 15px 20px;
    }
    
    .story h2 {
        font-size: 1.5em;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🐛 Bugs: <span id="bugs-fixed">0/1</span>
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- GAME CONTENT -->
<div class="world">
    <div class="overlay"></div>
    <div class="story">
      <h2>The Upside Down</h2>
      <p>
        The world feels wrong.  
        Everything is inverted and dark.
        <br><br>
        Eleven's voice echoes:
        <br><br>
        <em>"Turn the world right-side up to find the gate."</em>
      </p>
      <p class="hint">
        💡 Use DevTools (F12) to fix 1 bug!<br>
        <small>Hint: Fix the rotation to see the world correctly!</small>
      </p>
    </div>
    <div class="portal" title="The Gate"></div>
    <button class="escape-btn" id="escapeBtn" onclick="handleEscape(event)">
      ENTER THE GATE
    </button>
</div>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
// Track which bugs are fixed
const bugStatus = {
  bug1: false 
};

function checkEscapeConditions() {
  const world = document.querySelector('.world');
  const escapeBtn = document.getElementById('escapeBtn');
  
  // Check Bug 1: World rotation removed
  const worldStyle = window.getComputedStyle(world);
  const transform = worldStyle.transform;
  
  // Check if transform is 'none' or doesn't contain rotation
  const isRotationFixed = transform === 'none' || !transform.includes('matrix');
  bugStatus.bug1 = isRotationFixed;
  
  // Check if all bugs are fixed
  const allBugsFixed = bugStatus.bug1;
  
  // Update bug counter in header
  const bugsFixedCount = Object.values(bugStatus).filter(v => v).length;
  const bugCounter = document.getElementById('bugs-fixed');
  if (bugCounter) {
    bugCounter.textContent = `${bugsFixedCount}/1`;
  }
  
  // Enable/disable escape button
  if (allBugsFixed) {
    escapeBtn.classList.add('active');
  } else {
    escapeBtn.classList.remove('active');
  }
}

setInterval(checkEscapeConditions, 300);

async function handleEscape(event) {
  event.preventDefault();
  
  const escapeBtn = document.getElementById('escapeBtn');
  
  if (!escapeBtn.classList.contains('active')) {
    alert('❌ Fix the bug first! Use DevTools (F12)');
    return;
  }
  
  // Collect which bugs were fixed
  const bugsFixed = [];
  if (bugStatus.bug1) bugsFixed.push('bug1_rotation_fixed');
  
  console.log('🐛 Bugs fixed:', bugsFixed);
  
  escapeBtn.textContent = 'LOADING...';
  escapeBtn.style.pointerEvents = 'none';
  
  // Wait for gameEngine
  let retries = 0;
  const maxRetries = 20;
  
  while (!window.gameEngine && retries < maxRetries) {
    await new Promise(resolve => setTimeout(resolve, 100));
    retries++;
  }
  
  if (window.gameEngine) {
    await gameEngine.moveToNextPage(bugsFixed);
  } else {
    console.error('Game engine not loaded!');
    alert('Error: Game engine not loaded. Please refresh the page.');
    escapeBtn.textContent = 'ENTER THE GATE';
    escapeBtn.style.pointerEvents = 'auto';
  }
}

checkEscapeConditions();
</script>

</body>
</html>
