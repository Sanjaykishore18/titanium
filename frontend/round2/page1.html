<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="2">
<title>Web Escape | Round 2 - Page 1 (2 Bugs)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Orbitron:wght@400;700&display=swap');

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: 'Orbitron', sans-serif;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES
   ============================================================================ */

body {
    background: #0a0f0d url(page12.png) no-repeat center center;
    background-size: cover;
    font-family: 'Orbitron', sans-serif;
    min-height: 100vh;
    color: #fff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 80px;
}

.header {
    text-align: center;
    padding: 40px;
    z-index: 10;
}

h1 {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 4em;
    color: #2ecc71;
    text-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
    margin-bottom: 10px;
    letter-spacing: 10px;
}

.task-hint {
    color: #bdc3c7;
    font-size: 1.2em;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.game-hint {
    color: #ffd700;
    font-size: 1em;
    margin-top: 15px;
    background: rgba(0, 0, 0, 0.7);
    padding: 10px;
    border-radius: 5px;
}

.trial-ground {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.falling-stone {
    position: absolute;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle at 30% 30%, #555, #222);
    border-radius: 20px;
    clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: all;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    animation: falling 4s linear infinite;
    top: -150px;

    filter: blur(10px);
    opacity: 1;

    animation-play-state: paused;
}

@keyframes falling {
    0% {
        transform: translateY(0) rotate(0deg);
    }
    100% {
        transform: translateY(110vh) rotate(360deg);
    }
}

.falling-stone:nth-child(1) {
    left: 20%;
    animation-delay: 0s;
}

.falling-stone:nth-child(2) {
    left: 50%;
    animation-delay: 1.5s;
}

.falling-stone:nth-child(3) {
    left: 80%;
    animation-delay: 3s;
}

.falling-stone.slashed {
    animation: none;
    opacity: 0;
    transform: scale(2);
    transition: all 0.3s;
    pointer-events: none;
}

.slash-effect {
    position: fixed;
    height: 4px;
    background: #fff;
    box-shadow: 0 0 20px #2ecc71, 0 0 40px #fff;
    pointer-events: none;
    z-index: 1000;
    transform-origin: left;
    opacity: 0;
}

@keyframes slashAnim {
    0% {
        transform: scaleX(0);
        opacity: 1;
    }
    100% {
        transform: scaleX(1);
        opacity: 0;
    }
}

.success-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(46, 204, 113, 0.4) 0%, rgba(0, 0, 0, 0.9) 100%);
    z-index: 2000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.victory-text {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 5em;
    color: #fff;
    text-shadow: 0 0 30px #2ecc71;
    animation: textPulse 1s infinite;
}

@keyframes textPulse {
    0%, 100% {
        transform: scale(1);
        opacity: 1;
    }
    50% {
        transform: scale(1.1);
        opacity: 0.8;
    }
}

.inventory {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 100;
}

.sword-icon {
    font-size: 3em;
    opacity: 0.2;
    transition: all 0.5s;
}

.sword-icon.active {
    opacity: 1;
    transform: scale(1.2);
    filter: drop-shadow(0 0 10px #2ecc71);
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    h1 {
        font-size: 2.5em;
        letter-spacing: 5px;
    }
    
    .task-hint {
        font-size: 0.9em;
    }
    
    .falling-stone {
        width: 80px;
        height: 80px;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🐛 Bugs: <span id="bugs-fixed">0/2</span>
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- GAME CONTENT -->
<div class="header">
    <h1>SANTORYU TRIAL</h1>
    <div class="task-hint">SLASH THE FALLING STONES TO MASTER THE THREE SWORD STYLE</div>
    <div class="game-hint">
        💡 Use DevTools (F12) to fix 2 bugs!<br>
        <small>Hint: Make the stones clear and animated!</small>
    </div>
</div>

<div class="trial-ground" id="stoneContainer">
    <div class="falling-stone" onclick="slashStone(this, 0)"></div>
    <div class="falling-stone" onclick="slashStone(this, 1)"></div>
    <div class="falling-stone" onclick="slashStone(this, 2)"></div>
</div>

<div class="inventory">
    <div class="sword-icon" id="sword-0">⚔️</div>
    <div class="sword-icon" id="sword-1">⚔️</div>
    <div class="sword-icon" id="sword-2">⚔️</div>
</div>

<div class="success-overlay" id="victoryScreen">
    <div class="victory-text">SANTORYU MASTERED</div>
    <div style="color: #2ecc71; font-size: 1.5em; margin-top: 20px; letter-spacing: 5px;">PROCEED TO THE NEXT CHALLENGE</div>
</div>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
// Track which bugs are fixed
const bugStatus = {
  bug1: false, 
  bug2: false
};

let slashedCount = 0;
const totalStones = 3;
let bugsFixed = false;

function checkBugsFixed() {
    const stones = document.querySelectorAll('.falling-stone');
    if (stones.length === 0) return;
    
    const firstStone = stones[0];
    const stoneStyle = window.getComputedStyle(firstStone);

    const filter = stoneStyle.filter;
    bugStatus.bug1 = filter === 'none' || !filter.includes('blur');

    const animationState = stoneStyle.animationPlayState;
    bugStatus.bug2 = animationState === 'running';
    
    // Check if all bugs are fixed
    const allBugsFixed = bugStatus.bug1 && bugStatus.bug2;
    
    // Update bug counter in header
    const bugsFixedCount = Object.values(bugStatus).filter(v => v).length;
    const bugCounter = document.getElementById('bugs-fixed');
    if (bugCounter) {
        bugCounter.textContent = `${bugsFixedCount}/2`;
    }
    
    bugsFixed = allBugsFixed;
}

// Check bugs periodically
setInterval(checkBugsFixed, 300);

function slashStone(element, index) {
    if (!bugsFixed) {
        alert('❌ Fix all 2 bugs first! Use DevTools (F12)');
        return;
    }
    
    if (element.classList.contains('slashed')) return;

    createSlashEffect(element);

    element.classList.add('slashed');
    document.getElementById(`sword-${index}`).classList.add('active');
    slashedCount++;

    if (slashedCount === totalStones) {
        setTimeout(() => {
            document.getElementById('victoryScreen').style.display = 'flex';
            setTimeout(async () => {
                await moveToNextPage();
            }, 2000);
        }, 500);
    }
}

function createSlashEffect(target) {
    const rect = target.getBoundingClientRect();
    const effect = document.createElement('div');
    effect.className = 'slash-effect';

    const angle = Math.random() * 360;
    const length = 300;

    effect.style.left = (rect.left + rect.width / 2) + 'px';
    effect.style.top = (rect.top + rect.height / 2) + 'px';
    effect.style.width = length + 'px';
    effect.style.transform = `rotate(${angle}deg) translate(-50%, -50%)`;
    effect.style.animation = 'slashAnim 0.3s forwards';

    document.body.appendChild(effect);
    setTimeout(() => effect.remove(), 400);
}

async function moveToNextPage() {
    // Collect which bugs were fixed
    const bugsFixedArray = [];
    if (bugStatus.bug1) bugsFixedArray.push('bug1_blur_removed');
    if (bugStatus.bug2) bugsFixedArray.push('bug2_animation_playing');
    
    console.log('🐛 Bugs fixed:', bugsFixedArray);
    
    // Wait for gameEngine
    let retries = 0;
    const maxRetries = 20;
    
    while (!window.gameEngine && retries < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, 100));
        retries++;
    }
    
    if (window.gameEngine) {
        await gameEngine.moveToNextPage(bugsFixedArray);
    } else {
        console.error('Game engine not loaded!');
        alert('Error: Game engine not loaded. Please refresh the page.');
    }
}

checkBugsFixed();
</script>

</body>
</html>
