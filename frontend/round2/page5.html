<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="2">
<title>Web Escape | Round 2 - Page 5 (2 Bugs)</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+DW+Pica&display=swap" rel="stylesheet">
<style>
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: 'Orbitron', sans-serif;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES (UNCHANGED)
   ============================================================================ */

body {
    background: url("../assets/images/img 15.png") no-repeat center center/cover;
    font-family: 'Orbitron', sans-serif;
    min-height: 100vh;
    color: #fff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 80px; /* Added for header */
}

.header {
    position: absolute;
    top: 100px; /* Adjusted for game header */
    text-align: center;
    width: 100%;
}

h1 {
    font-family: 'Cinzel Decorative', cursive;
    font-size: 3.5em;
    color: #8b4513;
    text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
    margin-bottom: 5px;
}

.instruction {
    font-size: 1.2em;
    font-style: italic;
    color: #5d4037;
}

/* Unique Bug Container */
.treasure-area {
    width: 90vw;
    height: 70vh;
    position: relative;
}

.beli-coin {
    position: absolute;
    font-size: 3em;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    user-select: none;
    filter: drop-shadow(2px 2px 5px rgba(0, 0, 0, 0.3));

    /* BUG 1: Highly Unique CSS Bug - Ray Offset */
    /* This pushes the elements 100vw away along a specific angle, clearing them from the screen */
    offset-path: ray(90deg);

}


.beli-coin:hover {
    transform: scale(1.3) rotate(15deg);
}

.beli-coin.found {
    opacity: 0.5;
    filter: grayscale(1);
    pointer-events: none;
    transform: scale(0.8);
}

#navigation-confirm {
    margin-top: 30px;
    padding: 15px 40px;
    font-family: 'Cinzel Decorative', cursive;
    font-size: 1.5em;
    background: #f1c40f;
    color: #8b4513;
    border: 2px solid #8b4513;
    cursor: pointer;
    border-radius: 5px;
    transition: all 0.3s;
    box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    font-weight: bold;
    opacity: 0.3;

    mask-image: linear-gradient(black, black);
    -webkit-mask-image: linear-gradient(black, black);
}

#navigation-confirm.ready {
    opacity: 1;
}

#navigation-confirm:hover {
    background: #f39c12;
    transform: translateY(-2px);
    /* Hover fix won't work if root bug is there */
}


.success-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, #f1c40f 0%, #d35400 100%);
    z-index: 1000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: 'Cinzel Decorative', serif;
    text-align: center;
}

.success-overlay h2 {
    font-size: 5em;
    text-shadow: 0 0 20px #000;
}

#coin-counter {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 1.5em;
    font-weight: bold;
    color: #8b4513;
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    h1 {
        font-size: 2.5em;
    }
    
    .instruction {
        font-size: 1em;
    }
    
    .beli-coin {
        font-size: 2em;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🐛 Bugs: <span id="bugs-fixed">0/2</span>
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- ORIGINAL GAME CONTENT (UNCHANGED) -->
<div class="header">
    <h1>Berry Bonanza</h1>
    <p class="instruction">Find Nami's hidden Berry coins to unlock the vault!</p>
</div>

<!-- The coins are hidden by the Ray Offset bug in CSS -->
<div class="treasure-area" id="treasureArea">
    <div class="beli-coin" style="top: 15%; left: 20%;" onclick="collectCoin(this)">💰</div>
    <div class="beli-coin" style="top: 25%; left: 75%;" onclick="collectCoin(this)">💰</div>
    <div class="beli-coin" style="top: 60%; left: 10%;" onclick="collectCoin(this)">💰</div>
    <div class="beli-coin" style="top: 55%; left: 45%;" onclick="collectCoin(this)">💰</div>
    <div class="beli-coin" style="top: 75%; left: 80%;" onclick="collectCoin(this)">💰</div>
</div>

<div id="coin-counter">COINS COLLECTED: 0 / 5</div>

<button id="navigation-confirm" onclick="advance()">OPEN THE VAULT</button>

<div class="success-overlay" id="victoryScreen">
    <h2>BIG RICH!</h2>
    <p style="font-size: 2em;">Treasure secured. Wealth awaits!</p>
</div>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
// ============================================================================
// BUG TRACKING SYSTEM (ADDED FOR MULTIPLAYER)
// ============================================================================
const bugStatus = {
  bug1: false,  
  bug2: false
};

function checkBugsFixed() {
    const coins = document.querySelectorAll('.beli-coin');
    const button = document.getElementById('navigation-confirm');
    
    // Check Bug 1: Coins are not offset
    if (coins.length > 0) {
        const coinStyle = window.getComputedStyle(coins[0]);
        const offsetPath = coinStyle.offsetPath;
        bugStatus.bug1 = offsetPath === 'none' || !offsetPath || offsetPath === '';
    }
    
    // Check Bug 2: Button is visible (no mask)
    const btnStyle = window.getComputedStyle(button);
    const maskImage = btnStyle.maskImage || btnStyle.webkitMaskImage;
    bugStatus.bug2 = maskImage === 'none' || !maskImage || maskImage === '';
    
    // Update bug counter in header
    const bugsFixedCount = Object.values(bugStatus).filter(v => v).length;
    const bugCounter = document.getElementById('bugs-fixed');
    if (bugCounter) {
        bugCounter.textContent = `${bugsFixedCount}/2`;
    }
}

// Check bugs periodically
setInterval(checkBugsFixed, 300);

// ============================================================================
// ORIGINAL GAME LOGIC (UNCHANGED)
// ============================================================================
let coinsFound = 0;
const totalCoins = 5;

function collectCoin(element) {
    if (element.classList.contains('found')) return;

    element.classList.add('found');
    coinsFound++;

    updateUI();
}

function updateUI() {
    const counter = document.getElementById('coin-counter');
    counter.innerText = `COINS COLLECTED: ${coinsFound} / ${totalCoins}`;

    if (coinsFound === totalCoins) {
        document.getElementById('navigation-confirm').classList.add('ready');
    }
}

// ============================================================================
// MODIFIED ADVANCE FUNCTION (FOR MULTIPLAYER INTEGRATION)
// ============================================================================
async function advance() {
    if (coinsFound === totalCoins) {
        document.getElementById('victoryScreen').style.display = 'flex';
        
        setTimeout(async () => {
            // Collect which bugs were fixed
            const bugsFixed = [];
            if (bugStatus.bug1) bugsFixed.push('bug1_offset_path_fixed');
            if (bugStatus.bug2) bugsFixed.push('bug2_mask_image_fixed');
            
            console.log('🐛 Bugs fixed:', bugsFixed);
            console.log('💰 All coins collected!');
            
            // Wait for gameEngine
            let retries = 0;
            const maxRetries = 20;
            
            while (!window.gameEngine && retries < maxRetries) {
                await new Promise(resolve => setTimeout(resolve, 100));
                retries++;
            }
            
            if (window.gameEngine) {
                await gameEngine.moveToNextPage(bugsFixed);
            } else {
                console.error('Game engine not loaded!');
                // Fallback to original behavior
                window.location.href = 'page20.html';
            }
        }, 2000);
    }
}
checkBugsFixed();
</script>

</body>
</html>
