<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="2">
<title>Web Escape | Round 3 - Page 1 (2 Bugs)</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: Arial, sans-serif;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES
   ============================================================================ */

body {
    min-height: 100vh;
    background: url("./images/page21 bg.jpg") no-repeat center/cover;
    color: rgb(4, 4, 4);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    gap: 20px;
    padding-top: 100px;
}

h1 {
    font-size: 2.5rem;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    background: rgba(255, 255, 255, 0.9);
    padding: 20px;
    border-radius: 10px;
}

.game-hint {
    background: rgba(255, 215, 0, 0.9);
    padding: 15px;
    border-radius: 8px;
    font-size: 1rem;
    color: #000;
    font-weight: bold;
}

#light {
    font-size: 26px;
    font-weight: bold;
    padding: 15px 30px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
}

.red { 
    background: red;
    color: white;
}

.green { 
    background: green;
    color: white;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 8px;
    border: none;
    display: none;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    transition: all 0.3s;
}

button:hover {
    transform: scale(1.05);
}

#moveBTN {
    background: #4CAF50;
    color: white;
}

#escapeBtn {
    display: none;
    background: gold;
    color: black;
    font-weight: bold;
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    h1 {
        font-size: 2rem;
    }
    
    #light {
        font-size: 20px;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🐛 Bugs: <span id="bugs-fixed">0/2</span>
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- GAME CONTENT -->
<h1>Red Light 🚦 Green Light</h1>
<div class="game-hint">
    💡 Use DevTools (F12) to fix 2 bugs!<br>
    <small>Hint: Show the move button and fix the variable name!</small>
</div>
<div id="light" class="red">RED LIGHT</div>

<button id="moveBTN">MOVE</button>
<button id="escapeBtn">ESCAPE</button>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
// Track which bugs are fixed
const bugStatus = {
  bug1: false,  
  bug2: false
};

let isGreenLight = false;
const light = document.getElementById("light");
const moveBtn = document.getElementById("moveBtn");
const escapeBtn = document.getElementById("escapeBtn");

function checkBugsFixed() {
    const moveBtnElement = document.getElementById("moveBTN");
    
    if (moveBtnElement) {
        const btnStyle = window.getComputedStyle(moveBtnElement);
        const display = btnStyle.display;
        bugStatus.bug1 = display !== 'none';
    } else {
        const correctBtn = document.getElementById("moveBtn");
        if (correctBtn) {
            const btnStyle = window.getComputedStyle(correctBtn);
            const display = btnStyle.display;
            bugStatus.bug1 = display !== 'none';
        }
    }

    const correctBtn = document.getElementById("moveBtn");
    bugStatus.bug2 = correctBtn !== null;
    
    // Update bug counter in header
    const bugsFixedCount = Object.values(bugStatus).filter(v => v).length;
    const bugCounter = document.getElementById('bugs-fixed');
    if (bugCounter) {
        bugCounter.textContent = `${bugsFixedCount}/2`;
    }
}

// Check bugs periodically
setInterval(checkBugsFixed, 300);

// Toggle light every 3 seconds
setInterval(() => {
    isGreenLight = !isGreenLight;
    light.textContent = isGreenLight ? "GREEN LIGHT" : "RED LIGHT";
    light.className = isGreenLight ? "green" : "red";
}, 3000);

// Try to add event listener (will only work after bugs are fixed)
function setupMoveButton() {
    const allBugsFixed = bugStatus.bug1 && bugStatus.bug2;
    
    if (!allBugsFixed) return;
    
    const correctMoveBtn = document.getElementById("moveBtn");
    if (correctMoveBtn && !correctMoveBtn.hasAttribute('data-listener')) {
        correctMoveBtn.setAttribute('data-listener', 'true');
        correctMoveBtn.addEventListener("click", () => {
            if (!isGreenLight) {
                alert("💀 You moved on RED! Eliminated.\n\nWait for GREEN LIGHT!");
                return;
            }
            alert("✅ You moved safely!");
            escapeBtn.style.display = "inline-block";
        });
    }
}

// Try to setup button every second
setInterval(setupMoveButton, 1000);

escapeBtn.addEventListener("click", async () => {
    const allBugsFixed = bugStatus.bug1 && bugStatus.bug2;
    
    if (!allBugsFixed) {
        const missingFixes = [];
        if (!bugStatus.bug1) missingFixes.push('Change #moveBTN button display from none to inline-block');
        if (!bugStatus.bug2) missingFixes.push('Change button id from "moveBTN" to "moveBtn" (lowercase B)');
        
        alert('❌ Fix all 2 bugs first! Use DevTools (F12)');
        return;
    }
    
    await moveToNextPage();
});

async function moveToNextPage() {
    // Collect which bugs were fixed
    const bugsFixed = [];
    if (bugStatus.bug1) bugsFixed.push('bug1_move_button_visible');
    if (bugStatus.bug2) bugsFixed.push('bug2_variable_name_fixed');
    
    console.log('🐛 Bugs fixed:', bugsFixed);
    console.log('🎉 You escaped Red Light Green Light!');
    
    // Wait for gameEngine
    let retries = 0;
    const maxRetries = 20;
    
    while (!window.gameEngine && retries < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, 100));
        retries++;
    }
    
    if (window.gameEngine) {
        await gameEngine.moveToNextPage(bugsFixed);
    } else {
        console.error('Game engine not loaded!');
        alert('Error: Game engine not loaded. Please refresh the page.');
    }
}

checkBugsFixed();
</script>

</body>
</html>
