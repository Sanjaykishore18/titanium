<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="3">
<title>Web Escape | Round 3 - FREEDOM (3 Bugs)</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: monospace;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES
   ============================================================================ */

body {
    min-height: 100vh;
    background: url("./images/page30 bg.png") center/cover no-repeat;
    color: #eaffea;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 80px;
}

.game-hint-fixed {
    position: fixed;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 255, 153, 0.95);
    padding: 15px;
    border-radius: 8px;
    max-width: 700px;
    color: #000;
    font-weight: bold;
    text-align: center;
    z-index: 999;
    font-size: 0.9rem;
}

.freedom-panel {
    width: 480px;
    padding: 36px;
    border-radius: 16px;
    text-align: center;
    background-color: rgb(8, 5, 5);
    opacity: 0.95;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
}

h1 {
    color: #00ff99;
    letter-spacing: 2px;
    margin-bottom: 12px;
    font-size: 2.5rem;
}

.lock {
    display: flex;
    justify-content: space-between;
    margin: 30px 0;
    gap: 10px;
}

input { 
    width: 30%;
    padding: 14px;
    font-size: 20px;
    text-align: center;
    background: #000;
    color: #00ff99;
    border: 1px solid #00ff99;
    border-radius: 8px;
    font-family: monospace;
}


#digit2 {
    opacity: 0;
}

button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    background: #00ff99;
    color: #000;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 20px;
    font-weight: bold;
    transition: all 0.3s;
}

button:hover {
    background: #00cc7a;
    transform: scale(1.02);
}

.hint {
    margin-top: 18px;
    font-size: 13px;
    opacity: 1;
    line-height: 1.6;
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    .freedom-panel {
        width: 90%;
        max-width: 480px;
    }
    
    h1 {
        font-size: 2rem;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🐛 Bugs: <span id="bugs-fixed">0/3</span>
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- GAME HINT -->
<div class="game-hint-fixed">
    💡 Use DevTools (F12) to fix 3 bugs!<br>
    <small>Hint: Fix input types, visibility, and ID typos!</small>
</div>

<!-- GAME CONTENT -->
<div class="freedom-panel">
    <h1>🚪 FINAL DOOR</h1>
    <div class="hint">
        "Three digits. One escape.<br>
        What you don't see matters most."
    </div>
    <div class="lock">
        
        <input type="number" id="digit1" maxlength="1" placeholder="•">
        
        <input type="text" id="digit2" maxlength="1" placeholder="•">
        
        <input type="text" id="digti3" maxlength="1" placeholder="•">
    </div>
    <button id="unlockBtn">UNLOCK FREEDOM</button>
    <div class="hint">
        💡 Hint: Visibility is deception. Names matter.<br>
        <small>Correct code: 7 4 2</small>
    </div>
</div>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
// Track which bugs are fixed
const bugStatus = {
  bug1: false,  
  bug2: false,  
  bug3: false
};

const btn = document.getElementById('unlockBtn');

function checkBugsFixed() {
    const digit1 = document.getElementById('digit1');
    const digit2 = document.getElementById('digit2');
    const digit3Correct = document.getElementById('digit3');
    
    if (digit1) {
        bugStatus.bug1 = digit1.type === 'text';
    }
    
    // Check Bug 2: digit2 is visible
    if (digit2) {
        const digit2Style = window.getComputedStyle(digit2);
        const opacity = parseFloat(digit2Style.opacity);
        bugStatus.bug2 = opacity > 0.5;
    }
    
    // Check Bug 3: digit3 exists with correct ID
    bugStatus.bug3 = digit3Correct !== null;
    
    // Update bug counter in header
    const bugsFixedCount = Object.values(bugStatus).filter(v => v).length;
    const bugCounter = document.getElementById('bugs-fixed');
    if (bugCounter) {
        bugCounter.textContent = `${bugsFixedCount}/3`;
    }
}

// Check bugs periodically
setInterval(checkBugsFixed, 300);

btn.addEventListener('click', async () => {
    const allBugsFixed = bugStatus.bug1 && bugStatus.bug2 && bugStatus.bug3;
    
    if (!allBugsFixed) {
        const missingFixes = [];
        if (!bugStatus.bug1) missingFixes.push('Change #digit1 input type from "number" to "text"');
        if (!bugStatus.bug2) missingFixes.push('Change #digit2 opacity from 0 to 1');
        if (!bugStatus.bug3) missingFixes.push('Change third input id from "digti3" to "digit3"');
        
        alert(`❌ Fix all 3 bugs first! Use DevTools (F12) to:\n\n${missingFixes.map((fix, i) => `${i + 1}. ${fix}`).join('\n')}`);
        return;
    }
    
    const d1 = document.getElementById('digit1').value;
    const d2 = document.getElementById('digit2').value;
    const d3 = document.getElementById('digit3').value;
    
    /*
      Correct code: 7 4 2
    */
    if (d1 === "7" && d2 === "4" && d3 === "2") {
        alert("✅ You escaped. Freedom is yours. 🕊️");
        await achieveFreedom();
    } else {
        let feedback = "❌ The door refuses to open.\n\n";
        feedback += `Your code: ${d1 || '?'} ${d2 || '?'} ${d3 || '?'}\n`;
        feedback += `Correct code: 7 4 2\n\n`;
        feedback += "Try again!";
        alert(feedback);
    }
});

async function achieveFreedom() {
    // Collect which bugs were fixed
    const bugsFixed = [];
    if (bugStatus.bug1) bugsFixed.push('bug1_input_type_fixed');
    if (bugStatus.bug2) bugsFixed.push('bug2_visibility_restored');
    if (bugStatus.bug3) bugsFixed.push('bug3_id_typo_fixed');

    console.log('🐛 Bugs fixed:', bugsFixed);
    console.log('🕊️ Freedom achieved! Delegating to game engine to finalize round.');

    // Show a quick success screen while the engine handles scoring and redirect
    document.body.innerHTML = `
        <div style='\n            display: flex;\n            flex-direction: column;\n            justify-content: center;\n            align-items: center;\n            height: 100vh;\n            background: linear-gradient(135deg, #000, #003300);\n            color: #00ff99;\n            font-family: monospace;\n            text-align: center;\n            padding: 20px;\n        '>
            <h1 style='font-size: 4rem; margin-bottom: 20px; text-shadow: 0 0 20px #00ff99;'>
                🕊️ FREEDOM ACHIEVED 🕊️
            </h1>
            <p style='font-size: 1.5rem; margin-bottom: 30px;'>
                Finalizing your score and progress...
            </p>
            <p style='font-size: 1.2rem; opacity: 0.8;'>
                Returning to dashboard shortly...
            </p>
        </div>
    `;

    // Prefer calling the engine's moveToNextPage so score/page progress and teammate broadcasts are handled uniformly
    try {
        if (window.gameEngine && typeof window.gameEngine.moveToNextPage === 'function') {
            await window.gameEngine.moveToNextPage(bugsFixed);
            return;
        }

        // Wait briefly for gameEngine to initialize
        let retries = 0;
        const maxRetries = 20;
        while (!window.gameEngine && retries < maxRetries) {
            await new Promise(resolve => setTimeout(resolve, 100));
            retries++;
        }

        if (window.gameEngine && typeof window.gameEngine.moveToNextPage === 'function') {
            await window.gameEngine.moveToNextPage(bugsFixed);
            return;
        }

        // Fallback: if engine still isn't available, redirect to dashboard after a short delay
        console.warn('gameEngine not available; falling back to dashboard redirect');
        setTimeout(() => {
            const host = window.location.hostname;
            window.location.href = `http://${host}:8000/dashboard/`;
        }, 1500);
    } catch (err) {
        console.error('Error completing round via gameEngine:', err);
        const host = window.location.hostname;
        setTimeout(() => {
            window.location.href = `http://${host}:8000/dashboard/`;
        }, 1500);
    }
}

// Console hints
console.log("🚪 Final Door - FREEDOM Challenge");
console.log("STEP 1: Fix all 3 bugs using DevTools");
console.log("STEP 2: Enter the correct 3-digit code: 7 4 2");
console.log("STEP 3: Click UNLOCK FREEDOM to complete Round 3!");
console.log("");
console.log("Bugs to fix:");
console.log("1. #digit1 input type (number → text) - for maxlength to work");
console.log("2. #digit2 opacity (0 → 1) - to see middle digit");
console.log("3. Third input id (digti3 → digit3) - typo fix");
console.log("");
console.log("💡 Correct code: 7 4 2");

checkBugsFixed();
</script>

</body>
</html>
