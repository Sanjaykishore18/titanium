<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="2">
<title>Web Escape | Round 3 - Page 2 (2 Bugs)</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: Arial, sans-serif;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES
   ============================================================================ */

body {
    min-height: 100vh;
    background: url("../assets/images/img 22.png") no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    padding-top: 100px;
}

.container {
    background: rgba(8, 8, 8, 0.85);
    padding: 40px;
    border-radius: 14px;
    text-align: center;
    width: 350px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

h1 { 
    margin-bottom: 10px;
    color: #FFD700;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
}

.game-hint {
    background: rgba(255, 215, 0, 0.2);
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 15px;
    font-size: 0.9rem;
    color: #FFD700;
    border: 1px solid #FFD700;
}

p { 
    margin-bottom: 20px;
    color: #ccc;
}

button {
    padding: 12px 26px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: #FF6B35;
    color: #FFF;
    font-weight: bold;
    margin: 5px;
    opacity: 0;
    transition: all 0.3s;
}

button:hover { 
    background: #FF8C42;
    transform: scale(1.05);
}

button:disabled { 
    background: #00FF00; 
    color: #000;
    cursor: default;
}

#timer {
    background: rgba(0,0,0,0.6);
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-family: monospace;
    font-size: 24px;
    color: #FFD700;
}

#status { 
    margin-top: 20px; 
    font-size: 16px; 
    font-weight: bold;
    color: #FFF;
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    .container {
        width: 90%;
        max-width: 350px;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🐛 Bugs: <span id="bugs-fixed">0/2</span>
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- GAME CONTENT -->
<div class="container">
    <h1>Honeycomb Candy 🍯</h1>
    <p>Extract CIRCLE shape before time runs out!</p>
    
    <div class="game-hint">
        💡 Use DevTools (F12) to fix 2 bugs!<br>
        <small>Hint: Fix the typo in data attribute and show the button!</small>
    </div>
    
    <div id="timer">Time: 180s</div>
    
    <button
        id="extract-btn"
        data-sucess="true"
        onclick="extractShape()">
        EXTRACT CIRCLE
    </button>
    
    <div id="status">Click to extract shape!</div>
</div>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
// Track which bugs are fixed
const bugStatus = {
  bug1: false,
  bug2: false
};

let timeLeft = 180;
let timerInterval;

function checkBugsFixed() {
    const btn = document.getElementById('extract-btn');
    const btnStyle = window.getComputedStyle(btn);
    
    bugStatus.bug1 = btn.hasAttribute('data-success');
    
 
    const opacity = parseFloat(btnStyle.opacity);
    bugStatus.bug2 = opacity > 0.5;
    
    // Update bug counter in header
    const bugsFixedCount = Object.values(bugStatus).filter(v => v).length;
    const bugCounter = document.getElementById('bugs-fixed');
    if (bugCounter) {
        bugCounter.textContent = `${bugsFixedCount}/2`;
    }
}

// Check bugs periodically
setInterval(checkBugsFixed, 300);

// Start timer
function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = `Time: ${timeLeft}s`;
        
        if (timeLeft <= 10) {
            document.getElementById('timer').style.color = '#FF4444';
        }
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            document.getElementById('timer').textContent = 'Time: 0s';
            document.getElementById('status').innerHTML = "⏰ Time's up! Candy cracked!";
            document.getElementById('status').style.color = '#FF4444';
            document.getElementById('extract-btn').disabled = true;
        }
    }, 1000);
}

// Start timer on load
setTimeout(startTimer, 500);

function extractShape() {
    const allBugsFixed = bugStatus.bug1 && bugStatus.bug2;
    
    if (!allBugsFixed) {
        const missingFixes = [];
        if (!bugStatus.bug1) missingFixes.push('Change button attribute from data-sucess="true" to data-success="true"');
        if (!bugStatus.bug2) missingFixes.push('Change button opacity from 0 to 1');
        
        alert('❌ Fix all 2 bugs first! Use DevTools (F12)');
        return;
    }
    
    const status = document.getElementById('status');
    const btn = document.getElementById('extract-btn');
    
    // JS is correct - checks for "success" attribute
    const success = btn.dataset.success === "true";
    
    if (!success) {
        status.innerHTML = "❌ Candy cracked! Something is wrong...";
        status.style.color = "#FF4444";
        return;
    }
    
    clearInterval(timerInterval);
    status.innerHTML = "✅ Perfect extraction! Door unlocked! 🍬";
    status.style.color = "#00FF00";
    btn.textContent = "SUCCESS!";
    btn.disabled = true;
    
    setTimeout(async () => {
        await moveToNextPage();
    }, 2000);
}

async function moveToNextPage() {
    // Collect which bugs were fixed
    const bugsFixed = [];
    if (bugStatus.bug1) bugsFixed.push('bug1_typo_fixed');
    if (bugStatus.bug2) bugsFixed.push('bug2_button_visible');
    
    console.log('🐛 Bugs fixed:', bugsFixed);
    console.log('🍯 Honeycomb extracted successfully!');
    
    // Wait for gameEngine
    let retries = 0;
    const maxRetries = 20;
    
    while (!window.gameEngine && retries < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, 100));
        retries++;
    }
    
    if (window.gameEngine) {
        await gameEngine.moveToNextPage(bugsFixed);
    } else {
        console.error('Game engine not loaded!');
        alert('Error: Game engine not loaded. Please refresh the page.');
    }
}

checkBugsFixed();
</script>

<!-- One letter decides your fate -->
</body>
</html>
