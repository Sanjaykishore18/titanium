<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="1">
<title>Web Escape | Round 3 - Page 3 (1 Bug)</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: Arial, sans-serif;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES
   ============================================================================ */

body {
    min-height: 100vh;
    background: url("./images/page23 bg.png") center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    padding-top: 100px;
}

h1 {
    font-size: 3rem;
    margin-bottom: 20px;
    text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
}

.game-hint {
    background: rgba(255, 215, 0, 0.9);
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    color: #000;
    font-weight: bold;
    max-width: 500px;
}

p {
    font-size: 1.3rem;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
}

button {
    padding: 16px 40px;
    font-size: 20px;
    background: #c62828;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    transition: all 0.3s;
}

button:hover {
    background: #b71c1c;
    transform: scale(1.05);
}

button:active {
    transform: scale(0.95);
}

#power {
    font-size: 2rem;
    margin-top: 20px;
    font-weight: bold;
    color: #FFD700;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
}

#escape {
    display: none;
    margin-top: 30px;
    padding: 12px 25px;
    background: green;
    color: white;
    text-decoration: none;
    font-size: 18px;
    border-radius: 4px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    transition: all 0.3s;
}

#escape:hover {
    background: #2e7d32;
    transform: scale(1.05);
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    h1 {
        font-size: 2rem;
    }
    
    p {
        font-size: 1.1rem;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🐛 Bugs: <span id="bugs-fixed">0/1</span>
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- GAME CONTENT -->
<h1>Tug of War 💪</h1>
<div class="game-hint">
    💡 Use DevTools (F12) to fix 1 bug!<br>
    <small>Hint: Fix the button ID to match JavaScript!</small>
</div>
<p>Click fast to generate pulling power.</p>
<button id="pullBTN">PULL!</button>
<p id="power">Power: 0</p>
<a href="#" id="escape" onclick="proceedToNext(event)">ESCAPE</a>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
// Track which bugs are fixed
const bugStatus = {
  bug1: false
};

let power = 0;

function checkBugsFixed() {
    const correctBtn = document.getElementById("pullBtn");
    bugStatus.bug1 = correctBtn !== null;
    
    // Update bug counter in header
    const bugsFixedCount = Object.values(bugStatus).filter(v => v).length;
    const bugCounter = document.getElementById('bugs-fixed');
    if (bugCounter) {
        bugCounter.textContent = `${bugsFixedCount}/1`;
    }
}

// Check bugs periodically
setInterval(checkBugsFixed, 300);

// Try to setup event listener
function setupPullButton() {
    if (!bugStatus.bug1) return;
    
    const pullBtn = document.getElementById("pullBtn");
    if (pullBtn && !pullBtn.hasAttribute('data-listener')) {
        pullBtn.setAttribute('data-listener', 'true');
        pullBtn.addEventListener("click", function () {
            power++;
            document.getElementById("power").innerText = "Power: " + power;
            
            if (power >= 10) {
                document.getElementById("escape").style.display = "inline-block";
            }
        });
    }
}

// Try to setup every second
setInterval(setupPullButton, 1000);

async function proceedToNext(event) {
    event.preventDefault();
    
    if (!bugStatus.bug1) {
        alert('❌ Fix the bug first! Use DevTools (F12)');
        return;
    }
    
    if (power < 10) {
        alert(`❌ Not enough power! Current: ${power}/10\n\nKeep clicking PULL to reach 10 power!`);
        return;
    }
    
    // Collect which bugs were fixed
    const bugsFixed = [];
    if (bugStatus.bug1) bugsFixed.push('bug1_button_id_fixed');
    
    console.log('🐛 Bugs fixed:', bugsFixed);
    console.log('💪 Tug of War won with power:', power);
    
    // Wait for gameEngine
    let retries = 0;
    const maxRetries = 20;
    
    while (!window.gameEngine && retries < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, 100));
        retries++;
    }
    
    if (window.gameEngine) {
        await gameEngine.moveToNextPage(bugsFixed);
    } else {
        console.error('Game engine not loaded!');
        alert('Error: Game engine not loaded. Please refresh the page.');
    }
}

checkBugsFixed();
</script>

</body>
</html>
