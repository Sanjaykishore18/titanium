<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="1">
<title>Web Escape | Round 3 - Page 4 (1 Bug)</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: Arial, sans-serif;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES
   ============================================================================ */

body {
    background: url("../assets/images/img 24.png") no-repeat center center/cover;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 120px;
    min-height: 100vh;
}

.box {
    background: rgba(0, 0, 0, 0.7);
    padding: 40px;
    border-radius: 15px;
    max-width: 500px;
    margin: 0 auto;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

h2 {
    font-size: 2.5rem;
    margin-bottom: 15px;
    color: #FFD700;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
}

p {
    font-size: 1.2rem;
    margin-bottom: 25px;
}

.game-hint {
    background: rgba(255, 215, 0, 0.2);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    color: #FFD700;
    border: 1px solid #FFD700;
    font-size: 0.95rem;
}

form {
    margin-bottom: 20px;
}

button {
    padding: 12px 30px;
    margin: 10px;
    font-size: 18px;
    cursor: pointer;
    background: #1976d2;
    color: white;
    border: none;
    border-radius: 5px;
    transition: all 0.3s;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
}

button:hover {
    background: #1565c0;
    transform: scale(1.05);
}

button:active {
    transform: scale(0.95);
}

#result {
    margin-top: 20px;
    font-size: 18px;
    min-height: 30px;
    color: #FFD700;
    font-weight: bold;
}

#escape {
    display: none;
    margin-top: 25px;
    padding: 12px 25px;
    background: green;
    color: white;
    text-decoration: none;
    border-radius: 4px;
    font-size: 18px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    transition: all 0.3s;
}

#escape:hover {
    background: #2e7d32;
    transform: scale(1.05);
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    .box {
        width: 90%;
        padding: 30px 20px;
    }
    
    h2 {
        font-size: 2rem;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🐛 Bugs: <span id="bugs-fixed">0/1</span>
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- GAME CONTENT -->
<div class="box">
    <h2>Marbles Game 🔵</h2>
    <p>Guess correctly to survive.</p>
    
    <div class="game-hint">
        💡 Use DevTools (F12) to fix 1 bug!<br>
        <small>Hint: Change the data-unlocked attribute value!</small>
    </div>
    
    <form>
        <button type="button" id="oddBtn">ODD</button>
        <button type="button" id="evenBtn">EVEN</button>
    </form>
    
    <div id="result">Make your guess…</div>
    
    <a href="#" id="escape" data-unlocked="false" onclick="proceedToNext(event)">ESCAPE</a>
</div>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
// Track which bugs are fixed
const bugStatus = {
  bug1: false
};

const result = document.getElementById("result");
const escapeBtn = document.getElementById("escape");

function checkBugsFixed() {
    
    bugStatus.bug1 = escapeBtn.dataset.unlocked === "true";
    
    // Update bug counter in header
    const bugsFixedCount = Object.values(bugStatus).filter(v => v).length;
    const bugCounter = document.getElementById('bugs-fixed');
    if (bugCounter) {
        bugCounter.textContent = `${bugsFixedCount}/1`;
    }
}

// Check bugs periodically
setInterval(checkBugsFixed, 300);

async function checkGuess(guess) {
    result.innerText = "Checking marbles...";
    await new Promise(resolve => setTimeout(resolve, 1200));
    
    const marbles = Math.floor(Math.random() * 10) + 1;
    const correct = marbles % 2 === 0 ? "even" : "odd";
    
    if (guess === correct) {
        result.innerText = "✅ You won! (" + marbles + " marbles)";
        result.style.color = "#00FF00";
        
        // JS logic is correct - checks for "true"
        if (escapeBtn.dataset.unlocked === "true") {
            escapeBtn.style.display = "inline-block";
        } else {
            result.innerText += "\n\n❌ But something is still locked...";
            result.style.color = "#FF4444";
        }
    } else {
        result.innerText = "❌ You lost! (" + marbles + " marbles)";
        result.style.color = "#FF4444";
    }
}

document.getElementById("oddBtn").onclick = () => checkGuess("odd");
document.getElementById("evenBtn").onclick = () => checkGuess("even");

async function proceedToNext(event) {
    event.preventDefault();
    
    if (!bugStatus.bug1) {
        alert('❌ Fix the bug first! Use DevTools (F12)');
        return;
    }
    
    if (escapeBtn.style.display === 'none') {
        alert('❌ You must win the marble game first!\n\nGuess ODD or EVEN correctly to unlock escape.');
        return;
    }
    
    // Collect which bugs were fixed
    const bugsFixed = [];
    if (bugStatus.bug1) bugsFixed.push('bug1_data_unlocked_fixed');
    
    console.log('🐛 Bugs fixed:', bugsFixed);
    console.log('🔵 Marble game won!');
    
    // Wait for gameEngine
    let retries = 0;
    const maxRetries = 20;
    
    while (!window.gameEngine && retries < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, 100));
        retries++;
    }
    
    if (window.gameEngine) {
        await gameEngine.moveToNextPage(bugsFixed);
    } else {
        console.error('Game engine not loaded!');
        alert('Error: Game engine not loaded. Please refresh the page.');
    }
}

checkBugsFixed();
</script>

<!-- Winning is not enough. Check what is locked. -->
</body>
</html>
