<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="1">
<title>Web Escape | Round 3 - Page 6 (1 Bug)</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: Arial, sans-serif;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES
   ============================================================================ */

body {
    background: url("../assets/images/img 25.png") no-repeat center center/cover;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 160px;
    min-height: 100vh;
}

h2 {
    font-size: 2.5rem;
    margin-bottom: 15px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
}

p {
    font-size: 1.2rem;
    margin-bottom: 30px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
}

.game-hint {
    background: rgba(255, 215, 0, 0.9);
    padding: 15px;
    border-radius: 8px;
    margin: 0 auto 30px;
    max-width: 600px;
    color: #000;
    font-weight: bold;
}

.bridge {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 60px;
}

.panel {
    width: 120px;
    height: 120px;
    background: rgba(180, 220, 255, 0.2);
    border: 2px solid #9bd;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: bold;
    font-size: 1.2rem;
    transition: all 0.3s;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
}

.panel:hover {
    background: rgba(180, 220, 255, 0.35);
    transform: scale(1.05);
}

#status {
    margin-top: 30px;
    font-size: 18px;
    min-height: 30px;
    font-weight: bold;
}

#escape {
    display: none;
    margin-top: 30px;
    padding: 12px 30px;
    background: green;
    color: white;
    text-decoration: none;
    font-size: 18px;
    border-radius: 5px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    transition: all 0.3s;
}

#escape:hover {
    background: #2e7d32;
    transform: scale(1.05);
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    .bridge {
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }
    
    h2 {
        font-size: 2rem;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🐛 Bugs: <span id="bugs-fixed">0/1</span>
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- GAME CONTENT -->
<h2>Glass Bridge 🌉</h2>
<p>Only one panel is safe. Choose carefully.</p>

<div class="game-hint">
    💡 Use DevTools (F12) to fix 1 bug!<br>
    <small>Hint: Check the data-safe attribute value - case matters!</small>
</div>

<div class="bridge">
    <!-- ❌ BUG: data-safe="True" (capital T) but JavaScript checks for "true" (lowercase) -->
    <div class="panel" data-safe="True">LEFT</div>
    <div class="panel" data-safe="false">RIGHT</div>
</div>

<div id="status">Waiting for your move…</div>
<a href="#" id="escape" onclick="proceedToNext(event)">CROSS BRIDGE</a>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
// Track which bugs are fixed
const bugStatus = {
  bug1: false  // LEFT panel data-safe is "true" (lowercase)
};

const panels = document.querySelectorAll(".panel");
const status = document.getElementById("status");
const escape = document.getElementById("escape");

function checkBugsFixed() {
    const leftPanel = panels[0]; // First panel (LEFT)
    
    // Check Bug 1: data-safe is lowercase "true"
    bugStatus.bug1 = leftPanel.dataset.safe === "true";
    
    // Update bug counter in header
    const bugsFixedCount = Object.values(bugStatus).filter(v => v).length;
    const bugCounter = document.getElementById('bugs-fixed');
    if (bugCounter) {
        bugCounter.textContent = `${bugsFixedCount}/1`;
    }
}

// Check bugs periodically
setInterval(checkBugsFixed, 300);

panels.forEach(panel => {
    panel.addEventListener("click", () => {
        // 🧠 CLUE: Checks for lowercase "true"
        if (panel.dataset.safe === "true") {
            status.innerText = "✅ You chose the correct panel!";
            status.style.color = "#00FF00";
            escape.style.display = "inline-block";
        } else {
            status.innerText = "❌ Glass shattered. Wrong choice.";
            status.style.color = "#FF4444";
        }
    });
});

async function proceedToNext(event) {
    event.preventDefault();
    
    if (!bugStatus.bug1) {
        alert('❌ Fix the bug first! Use DevTools (F12) to:\n\nChange LEFT panel data-safe from "True" to "true" (lowercase T)');
        return;
    }
    
    if (escape.style.display === 'none') {
        alert('❌ You must choose the correct panel first!\n\nClick the LEFT panel to cross safely.');
        return;
    }
    
    // Collect which bugs were fixed
    const bugsFixed = [];
    if (bugStatus.bug1) bugsFixed.push('bug1_case_sensitivity_fixed');
    
    console.log('🐛 Bugs fixed:', bugsFixed);
    console.log('🌉 Glass bridge crossed safely!');
    
    // Wait for gameEngine
    let retries = 0;
    const maxRetries = 20;
    
    while (!window.gameEngine && retries < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, 100));
        retries++;
    }
    
    if (window.gameEngine) {
        await gameEngine.moveToNextPage(bugsFixed);
    } else {
        console.error('Game engine not loaded!');
        alert('Error: Game engine not loaded. Please refresh the page.');
    }
}

// Console hints
console.log("🌉 Glass Bridge Challenge");
console.log("STEP 1: Fix 1 bug using DevTools");
console.log("STEP 2: Click the correct panel (LEFT)");
console.log("STEP 3: Click CROSS BRIDGE to proceed");
console.log("");
console.log("Bug to fix:");
console.log("1. LEFT panel data-safe attribute (True → true) - lowercase matters!");
console.log("");
console.log("🧠 CLUE: JavaScript checks for lowercase 'true'");

checkBugsFixed();
</script>

</body>
</html>
