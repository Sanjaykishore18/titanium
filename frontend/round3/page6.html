<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="2">
<title>Web Escape | Round 3 - Page 7 (2 Bugs)</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: monospace;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES
   ============================================================================ */

body {
    background: url("../assets/images/img 26.png") no-repeat center center/cover;
    color: #eaeaea;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding-top: 80px;
}

.panel {
    background: rgba(0, 0, 0, 0.85);
    padding: 50px;
    border-radius: 15px;
    text-align: center;
    max-width: 500px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
}

h2 {
    font-size: 2.5rem;
    margin-bottom: 20px;
    color: #FF6B6B;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
}

p {
    font-size: 1.2rem;
    margin-bottom: 25px;
    color: #ccc;
}

.game-hint {
    background: rgba(255, 215, 0, 0.2);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    color: #FFD700;
    border: 1px solid #FFD700;
    font-size: 0.95rem;
}

button {
    padding: 12px 25px;
    margin-top: 20px;
    background: crimson;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 16px;
    /* ❌ BUG 1: Button not clickable! */
    pointer-events: none;
    border-radius: 5px;
    transition: all 0.3s;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
}

button:hover {
    background: #dc143c;
    transform: scale(1.05);
}

#status {
    margin-top: 20px;
    font-size: 1.1rem;
    min-height: 30px;
    color: #FFD700;
    font-weight: bold;
}

#escape {
    display: none;
    margin-top: 30px;
    padding: 12px 25px;
    background: green;
    color: white;
    text-decoration: none;
    font-size: 18px;
    border-radius: 5px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    transition: all 0.3s;
}

#escape:hover {
    background: #2e7d32;
    transform: scale(1.05);
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    .panel {
        width: 90%;
        padding: 40px 30px;
    }
    
    h2 {
        font-size: 2rem;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🐛 Bugs: <span id="bugs-fixed">0/2</span>
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- GAME CONTENT -->
<div class="panel">
    <h2>Encrypted Files 🔐</h2>
    <p>Decrypt the Front Man's data.</p>
    
    <div class="game-hint">
        💡 Use DevTools (F12) to fix 2 bugs!<br>
        <small>Hint: Make button clickable and fix the data-key value!</small>
    </div>
    
    <!-- ❌ BUG 2: data-key="front-man" but JavaScript checks for "frontman" (no hyphen) -->
    <button id="decryptBtn" data-key="front-man">
        Decrypt Files
    </button>
    
    <p id="status"></p>
    <a id="escape" href="#" onclick="proceedToNext(event)">ACCESS GRANTED</a>
</div>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
// Track which bugs are fixed
const bugStatus = {
  bug1: false,  // Button pointer-events is not none
  bug2: false   // Button data-key is "frontman" (no hyphen)
};

function checkBugsFixed() {
    const btn = document.getElementById('decryptBtn');
    const btnStyle = window.getComputedStyle(btn);
    
    // Check Bug 1: pointer-events is auto/all (not none)
    const pointerEvents = btnStyle.pointerEvents;
    bugStatus.bug1 = pointerEvents !== 'none';
    
    // Check Bug 2: data-key is "frontman" (no hyphen)
    bugStatus.bug2 = btn.dataset.key === "frontman";
    
    // Update bug counter in header
    const bugsFixedCount = Object.values(bugStatus).filter(v => v).length;
    const bugCounter = document.getElementById('bugs-fixed');
    if (bugCounter) {
        bugCounter.textContent = `${bugsFixedCount}/2`;
    }
}

// Check bugs periodically
setInterval(checkBugsFixed, 300);

document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("decryptBtn");
    const status = document.getElementById("status");
    const escape = document.getElementById("escape");
    
    btn.addEventListener("click", () => {
        const allBugsFixed = bugStatus.bug1 && bugStatus.bug2;
        
        if (!allBugsFixed) {
            const missingFixes = [];
            if (!bugStatus.bug1) missingFixes.push('Change button pointer-events from none to auto');
            if (!bugStatus.bug2) missingFixes.push('Change button data-key from "front-man" to "frontman" (remove hyphen)');
            
            alert(`❌ Fix all 2 bugs first! Use DevTools (F12) to:\n\n${missingFixes.map((fix, i) => `${i + 1}. ${fix}`).join('\n')}`);
            return;
        }
        
        const key = btn.dataset.key;
        if (key === "frontman") {
            status.textContent = "✅ Decryption successful.";
            status.style.color = "#00FF00";
            escape.style.display = "inline-block";
        } else {
            status.textContent = "❌ Invalid key.";
            status.style.color = "#FF4444";
        }
    });
});

async function proceedToNext(event) {
    event.preventDefault();
    
    // FIX: Get escape element reference
    const escape = document.getElementById("escape");
    
    if (escape.style.display === 'none') {
        alert('❌ You must decrypt the files first!\n\nClick "Decrypt Files" button after fixing both bugs.');
        return;
    }
    
    // Collect which bugs were fixed
    const bugsFixed = [];
    if (bugStatus.bug1) bugsFixed.push('bug1_button_clickable');
    if (bugStatus.bug2) bugsFixed.push('bug2_key_format_fixed');
    
    console.log('🐛 Bugs fixed:', bugsFixed);
    console.log('🔐 Files decrypted successfully!');
    
    // Wait for gameEngine
    let retries = 0;
    const maxRetries = 20;
    
    while (!window.gameEngine && retries < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, 100));
        retries++;
    }
    
    if (window.gameEngine) {
        await gameEngine.moveToNextPage(bugsFixed);
    } else {
        console.error('Game engine not loaded!');
        alert('Error: Game engine not loaded. Please refresh the page.');
    }
}

// Console hints
console.log("🔐 Front Man's Office Challenge");
console.log("STEP 1: Fix all 2 bugs using DevTools");
console.log("STEP 2: Click 'Decrypt Files' button");
console.log("STEP 3: Click ACCESS GRANTED to proceed");
console.log("");
console.log("Bugs to fix:");
console.log("1. Button pointer-events (none → auto)");
console.log("2. Button data-key attribute (front-man → frontman) - remove hyphen!");

checkBugsFixed();
</script>

</body>
</html>
