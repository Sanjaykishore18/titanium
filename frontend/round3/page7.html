<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="total-bugs" content="2">
<title>Web Escape | Round 3 - Page 8 (2 Bugs)</title>
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ============================================================================
   GAME HEADER
   ============================================================================ */
.game-header {
    background: rgba(0,0,0,0.95);
    padding: 15px 30px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    border-bottom: 3px solid #667eea;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    font-family: Arial, sans-serif;
}

.team-info {
    color: #667eea;
}

.timer {
    background: #dc3545;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
}

.timer-warning {
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.bugs-indicator {
    background: #28a745;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.exit-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.3s;
}

.exit-btn:hover {
    background: #c82333;
}

/* Notifications */
.notification {
    position: fixed;
    top: 110px;
    right: -350px;
    background: rgba(102, 126, 234, 0.95);
    color: white;
    padding: 15px 25px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: right 0.3s;
    z-index: 999;
    max-width: 300px;
}

.notification.show {
    right: 20px;
}

.notification-success {
    background: rgba(40, 167, 69, 0.95);
}

.notification-error {
    background: rgba(220, 53, 69, 0.95);
}

.notification-info {
    background: rgba(23, 162, 184, 0.95);
}

/* ============================================================================
   ORIGINAL GAME STYLES
   ============================================================================ */

body {
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    background: url("../assets/images/img 27.png") no-repeat center center/cover;
    min-height: 100vh;
    background-position: center;
    overflow-x: hidden;
    padding-top: 120px;
}

h1 {
    font-size: 2.5rem;
    margin-bottom: 15px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
}

p {
    font-size: 1.2rem;
    margin-bottom: 30px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
}

.game-hint {
    background: rgba(255, 215, 0, 0.9);
    padding: 15px;
    border-radius: 8px;
    margin: 0 auto 30px;
    max-width: 600px;
    color: #000;
    font-weight: bold;
}

.lounge {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 60px;
    flex-wrap: wrap;
}

.camera {
    width: 120px;
    height: 120px;
    background: red;
    border-radius: 12px;
    cursor: pointer;
    position: relative;
    margin: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    transition: all 0.3s;
    /* ❌ BUG 1: Clicks blocked! */
    pointer-events: none;
}

.camera::after {
    content: "VIP CAM";
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
}

.camera:hover {
    transform: scale(1.05);
}

/* ❌ BUG 2: Class name is "disabled" but JavaScript adds "off" */
.camera.disabled {
    background: #333;
}

button {
    margin-top: 50px;
    padding: 12px 22px;
    font-size: 16px;
    cursor: pointer;
    background: #1976d2;
    color: white;
    border: none;
    border-radius: 5px;
    transition: all 0.3s;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
}

button:hover {
    background: #1565c0;
    transform: scale(1.05);
}

.status {
    margin-top: 20px;
    font-weight: bold;
    font-size: 1.1rem;
    min-height: 30px;
}

/* Responsive */
@media (max-width: 768px) {
    .game-header {
        flex-direction: column;
        align-items: stretch;
    }
    
    h1 {
        font-size: 2rem;
    }
    
    .lounge {
        gap: 20px;
    }
    
    .camera {
        width: 100px;
        height: 100px;
    }
}
</style>
</head>
<body>

<!-- GAME HEADER -->
<div class="game-header">
    <div class="team-info">
        <strong id="team-name">Loading...</strong><br>
        <small>Round <span id="round-num">-</span> - Page <span id="page-num">-</span> | Score: <span id="current-score">0</span></small>
    </div>
    
    <div class="timer" id="timer">--:--</div>
    
    <div class="bugs-indicator">
        🐛 Bugs: <span id="bugs-fixed">0/2</span>
    </div>
    
    <button class="exit-btn" onclick="exitGame()">
        ← Exit Game
    </button>
</div>

<!-- GAME CONTENT -->
<h1>VIP Lounge 📹</h1>
<p>Disable all surveillance cameras</p>

<div class="game-hint">
    💡 Use DevTools (F12) to fix 2 bugs!<br>
    <small>Hint: Make cameras clickable and fix the CSS class name!</small>
</div>

<div class="lounge">
    <div class="camera" data-state="active"></div>
    <div class="camera" data-state="active"></div>
    <div class="camera" data-state="active"></div>
</div>

<button id="checkBtn">Check Cameras</button>
<div class="status" id="status"></div>

<!-- Load Scripts -->
<script src="../assets/js/config.js"></script>
<script src="../assets/js/game-engine.js"></script>

<script>
// Track which bugs are fixed
const bugStatus = {
  bug1: false,  // Cameras pointer-events is not none
  bug2: false   // CSS class .off exists (not .disabled)
};

const cameras = document.querySelectorAll(".camera");
const statusText = document.getElementById("status");

function checkBugsFixed() {
    // Check Bug 1: pointer-events is auto
    const firstCamera = cameras[0];
    const camStyle = window.getComputedStyle(firstCamera);
    const pointerEvents = camStyle.pointerEvents;
    bugStatus.bug1 = pointerEvents !== 'none';
    
    // Check Bug 2: Check if .camera.off CSS rule exists
    // We'll check if any camera has the "off" class and if it changes background
    const testDiv = document.createElement('div');
    testDiv.className = 'camera off';
    testDiv.style.display = 'none';
    document.body.appendChild(testDiv);
    const testStyle = window.getComputedStyle(testDiv);
    const hasOffClass = testStyle.background.includes('51, 51, 51') || testStyle.background.includes('#333');
    document.body.removeChild(testDiv);
    bugStatus.bug2 = hasOffClass;
    
    // Update bug counter in header
    const bugsFixedCount = Object.values(bugStatus).filter(v => v).length;
    const bugCounter = document.getElementById('bugs-fixed');
    if (bugCounter) {
        bugCounter.textContent = `${bugsFixedCount}/2`;
    }
}

// Check bugs periodically
setInterval(checkBugsFixed, 300);

cameras.forEach(cam => {
    cam.addEventListener("click", async () => {
        if (!bugStatus.bug1 || !bugStatus.bug2) {
            return; // Don't process clicks if bugs not fixed
        }
        
        await new Promise(resolve => setTimeout(resolve, 300));
        cam.classList.add("off");
        cam.dataset.state = "off";
    });
});

document.getElementById("checkBtn").addEventListener("click", async () => {
    const allBugsFixed = bugStatus.bug1 && bugStatus.bug2;
    
    if (!allBugsFixed) {
        const missingFixes = [];
        if (!bugStatus.bug1) missingFixes.push('Change .camera pointer-events from none to auto');
        if (!bugStatus.bug2) missingFixes.push('Change CSS class name from .camera.disabled to .camera.off');
        
        alert(`❌ Fix all 2 bugs first! Use DevTools (F12) to:\n\n${missingFixes.map((fix, i) => `${i + 1}. ${fix}`).join('\n')}`);
        return;
    }
    
    const activeCameras = [...cameras].filter(
        cam => cam.dataset.state === "active"
    );
    
    if (activeCameras.length === 0) {
        statusText.textContent = "✅ All cameras disabled. Proceeding...";
        statusText.style.color = "#00FF00";
        
        setTimeout(async () => {
            await moveToNextPage();
        }, 1000);
    } else {
        statusText.textContent = `❌ ${activeCameras.length} VIP camera(s) still active! Click them to disable.`;
        statusText.style.color = "#FF4444";
    }
});

async function moveToNextPage() {
    // Collect which bugs were fixed
    const bugsFixed = [];
    if (bugStatus.bug1) bugsFixed.push('bug1_cameras_clickable');
    if (bugStatus.bug2) bugsFixed.push('bug2_class_name_fixed');
    
    console.log('🐛 Bugs fixed:', bugsFixed);
    console.log('📹 All cameras disabled!');
    
    // Wait for gameEngine
    let retries = 0;
    const maxRetries = 20;
    
    while (!window.gameEngine && retries < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, 100));
        retries++;
    }
    
    if (window.gameEngine) {
        await gameEngine.moveToNextPage(bugsFixed);
    } else {
        console.error('Game engine not loaded!');
        alert('Error: Game engine not loaded. Please refresh the page.');
    }
}

// Console hints
console.log("📹 VIP Lounge Challenge");
console.log("STEP 1: Fix all 2 bugs using DevTools");
console.log("STEP 2: Click all 3 red cameras to disable them");
console.log("STEP 3: Click 'Check Cameras' button");
console.log("STEP 4: Proceed when all cameras are off");
console.log("");
console.log("Bugs to fix:");
console.log("1. .camera pointer-events (none → auto)");
console.log("2. CSS class name (.camera.disabled → .camera.off)");

checkBugsFixed();
</script>

</body>
</html>
